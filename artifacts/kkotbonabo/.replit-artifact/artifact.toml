kind = "web"
previewPath = "/"
title = "FLOG"
version = "1.0.0"
id = "artifacts/kkotbonabo"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18543

[services.development]
run = "pnpm --filter @workspace/kkotbonabo run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/kkotbonabo", "run", "build" ]
publicDir = "artifacts/kkotbonabo/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18543"
BASE_PATH = "/"
